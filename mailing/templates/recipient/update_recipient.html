{% block content %}

{% include 'main_menu.html' %}

<div class="container mt-5">
    <h1 class="mb-4">Редактирование получателя</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-lg btn btn-light bg-secondary bg-opacity-25 pt-1 pb-1">Сохранить</button>
        <a href="{% url 'mailing:all_recipient' %}" class="btn-lg btn btn-light bg-secondary bg-opacity-25 pt-1 pb-1">Отмена</a>
    </form>
</div>

{% endblock %}
