<!DOCTYPE html>
<html>
<head>
    <title>Доступ запрещён</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<div class="position-absolute top-50 start-50 translate-middle text-center pb-5">
    <h1>Ошибка 403</h1>
    <p>{{ message }}</p>
    {% if exception %}
    <p><small>Причина: {{ exception }}</small></p>
    {% endif %}
    <div class="text-center">
        <button onclick="history.back(); return false;" class="btn-lg btn btn-secondary">Назад</button>
    </div>
</div>
</body>
</html>
