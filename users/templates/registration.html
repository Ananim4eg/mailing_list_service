{% block content %}

{% include 'main_menu.html' %}

<div class="container mt-5">
    <h1 class="mb-4">Регистрация</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn btn-light bg-secondary bg-opacity-25">Зарегистрироваться</button>
        <a href="{% url 'mailing:home_page' %}" class="btn btn btn-light bg-secondary bg-opacity-25">Назад</a>
    </form>
</div>

{% endblock %}
